{% extends "base.html" %}

{% block content %}
<style>
    .message-json{display: none;}
</style>
<script type="text/javascript">
    function toggleJson(){
        console.log();
    }

</script>
<ul>
    {% for item in messages  %}
    <li><a href="#message-{{item.message_id}}" class="message" id="message-{{item.message_id}}" onclick="toggleJson();">{{item.message_id}}</a> {{item.message_title}} // saved on: {{item.attempted}}</li>
    <li class="message-json" id="json-{{item.message_id}}"><pre>{{item.message_json}}</pre></li>
    {% endfor %}
</ul>

<script type="text/javascript">
    
    $(document).ready(function(){

        $('.message-json pre').each(function(){//let's figure out how to make this pretty later.
            // this.innerHTML = JSON.stringify(JSON.parse(this.innerHTML),null,2);
            this.innerHTML =JSON.stringify(this.innerHTML, null, 2);
            // x = JSON.parse(this.innerHTML);
            // console.log(x);
            // console.log(this.innerHTML);
        });
        $(".message").click(function(){
            // console.log(this.id);
            mess_id = this.id.split('-')[1];
            $('#json-'+mess_id).toggle();
        });
});

</script>
{%endblock%}
